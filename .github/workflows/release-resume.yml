name: Release resume

# Builds the HTML and PDF resume from Resume-Tom-Dean.md and publishes them as
# a GitHub Release. The README links to releases/latest/download/..., so the
# newest release is always the current resume.

on:
  push:
    branches: [main]
    paths:
      - Resume-Tom-Dean.md
      - resume/resume.css # not resume/**: LinkedIn text edits aren't resume changes
      - scripts/build-resume.sh
      - .github/workflows/release-resume.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-resume
  cancel-in-progress: false

jobs:
  release:
    # A dispatch from another branch would publish an unreviewed resume.
    if: github.ref == 'refs/heads/main'
    # Pinned so an image change (and a newer pandoc) can't reflow the PDF unnoticed.
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pandoc and pdfinfo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc poppler-utils

      - name: Build resume
        run: scripts/build-resume.sh dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          day=$(date -u +%Y-%m-%d)
          tag="resume-$day-${SHA::7}"
          # A re-run on the same day and commit replaces the assets instead of failing.
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$REPO" --clobber \
              dist/Resume-Tom-Dean.pdf dist/Resume-Tom-Dean.html
            exit 0
          fi
          # Only the newest commit on main becomes the latest release, so re-running
          # an older run can't put an older resume behind the public link.
          latest=true
          if [ "$SHA" != "$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)" ]; then
            latest=false
          fi
          gh release create "$tag" \
            --repo "$REPO" \
            --target "$SHA" \
            --title "Resume $day (${SHA::7})" \
            --notes "Built from Resume-Tom-Dean.md at ${SHA::7}." \
            --latest="$latest" \
            dist/Resume-Tom-Dean.pdf dist/Resume-Tom-Dean.html
